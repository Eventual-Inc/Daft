# Workspace clippy configuration.
#
# `daft-device` governed-pullback contract: implicit engine-driven
# device-to-host materialization must go through
# `daft_device::materialize_to_host` so every pullback is counted and
# attributed a reason (the empirical priority list for adding device kernel
# arms). Direct `copy_to_host` is reserved for explicit user-requested exits
# (`to_cupy()` / `__dlpack__` style); those call sites carry an
# `#[allow(clippy::disallowed_methods)]` with a justification comment.
disallowed-methods = [
    { path = "daft_device::buffer::DeviceBuffer::copy_to_host", reason = "engine code must use daft_device::materialize_to_host so implicit pullbacks are counted; explicit user-facing exit sites may #[allow] with a justification" },
]
