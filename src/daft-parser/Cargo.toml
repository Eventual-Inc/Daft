[build-dependencies]
lalrpop = {version = "0.23.1", default-features = false}

[dependencies]
daft-ast = {path = "../daft-ast"}
lalrpop-util = {version = "0.23.1", default-features = false}
logos = "0.16.1"
thiserror = {workspace = true}

[dev-dependencies]
rstest = {workspace = true}

